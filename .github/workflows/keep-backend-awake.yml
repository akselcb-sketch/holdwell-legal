name: Keep the meal-photo backend awake

# Holdwell's meal-photo function runs on a Supabase free-plan project, which is paused after a week without traffic.
# Once a day this sends it a tiny image for an account with no subscription. The expected answer is 402: the function,
# its RevenueCat check and its database all ran, which counts as activity. Any other answer fails the run, and GitHub
# emails the repository owner, so this doubles as a daily health check.

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call analyze-meal
        env:
          URL: https://dbghltxpfnajsisqhtay.supabase.co/functions/v1/analyze-meal
          IMG: 
        run: |
          code=$(curl -s -o body.txt -w '%{http_code}' --max-time 60 -X POST "$URL" \
            -H 'Content-Type: application/json' \
            --data "{\"image_base64\":\"$IMG\",\"app_user_id\":\"keepalive-daily\"}")
          echo "HTTP $code"
          cat body.txt
          echo
          test "$code" = "402"
